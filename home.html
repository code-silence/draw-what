<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Bugs Zero Fix - Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&family=Rajdhani:wght@300;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="atlas-theme no-scroll">

    <!-- Space Background Animations -->
    <div class="space-dust layer-1"></div>
    <div class="space-dust layer-2"></div>
    <div class="glow-ring"></div>

    <div class="atlas-container arcade-layout">
        
        <!-- Animated Glassy Header (Fixed) -->
        <div class="animated-header-wrapper">
            <header class="glassy-header-content">
                <div class="atlas-logo glowing-logo">THREE BUGS ZERO FIX</div>
                <div class="auth-group">
                    <button class="nav-btn-outline auth-btn">LOGIN</button>
                    <button class="atlas-btn-primary auth-btn-primary">
                        <span class="btn-text">REGISTER</span>
                    </button>
                </div>
            </header>
        </div>

        <main class="arcade-main">
            <!-- Animated & Attractive Text -->
            <div class="hero-text-section">
                <h1 class="atlas-headline glitch-title">
                    <span class="text-light">MULTIPLAYER</span><br>
                    <span class="text-bold text-glow">NEXUS</span>
                </h1>
                <div class="typing-container">
                    <p class="cyber-typing-text">SELECT YOUR GAME...</p>
                </div>
            </div>

            <!-- Compact & Glassy Game Card -->
            <div class="arcade-center-wrapper">
                <div class="game-card glassy-card floating-card">
                    <div class="card-image compact-image">
                        <!-- ড্রয়িং আইকন -->
                        <img src="https://cdn-icons-png.flaticon.com/512/2916/2916314.png" alt="Draw What">
                    </div>
                    <div class="card-content compact-content">
                        <h2 class="game-title text-glow" style="font-size: 1.5rem;">DRAW WHAT!</h2>
                        <p class="game-desc" style="font-size: 0.85rem;">Real-time drawing & guessing sync. Establish a node now!</p>
                        
                        <a href="index.html" style="text-decoration: none;">
                            <button class="atlas-btn-primary play-btn-modern">
                                <span class="btn-text">PLAY NOW</span>
                            </button>
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
